<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title>Portfolio Windows 11 - Aristide Ghislain Adouko</title>
  
  <meta name="description" content="Portfolio interactif de développeur Full Stack Junior - Expérience immersive style Windows 11">
  <meta name="author" content="Aristide Ghislain Adouko">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
  
  <!-- Preconnect to CDNs -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Tailwind CSS (sera généré par Vite) -->
  <link rel="stylesheet" href="/src/css/style.css">
  
  <!-- xterm.js pour le terminal -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  
  <style>
    /* Fond d'écran personnalisé */
    body {
      background-image: url('/assets/images/wallpaper.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    
    /* Fallback gradient si pas d'image */
    .light body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .dark body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }
    
    /* Curseur personnalisé */
    * {
      cursor: default;
    }
    
    a, button, [role="button"], .taskbar-icon, .desktop-icon, .window-control {
      cursor: pointer;
    }
    
    /* Masquer la scrollbar mais garder le scroll */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.7);
    }
  </style>
</head>
<body class="light">
  <!-- Bureau principal -->
  <div class="desktop" id="desktop">
    <!-- Les icônes seront ajoutées dynamiquement par JS -->
    
    <!-- Barre des tâches -->
    <div class="taskbar" id="taskbar">
      <!-- Sera rempli par JS -->
    </div>
  </div>
  
  <!-- Menu contextuel (sera ajouté dynamiquement) -->
  
  <!-- Container pour les notifications toast (sera ajouté dynamiquement) -->
  
  <!-- Scripts modules -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
